[project]
name = "omni-bench-core"
version = "0.7.3"
description = "The shared core of the omni benchmarks: tasks, adapters, scorers, runs and the loop over them"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Datalab" }]
keywords = ["benchmark", "evaluation", "document-ai", "ocr", "llm-as-a-judge"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyarrow>=15", "rich>=13"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]

[project.urls]
Homepage = "https://github.com/datalab-to/omni-bench-core"
Datalab = "https://datalab.to"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omni_bench_core"]
